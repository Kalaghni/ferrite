services:
  ferrite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ferrite-server:latest
    container_name: ferrite
    # Host networking so LAN discovery (multicast 239.255.70.82 and broadcast
    # on UDP 27499) reaches the server; game traffic is UDP 27500.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ferrite-data:/data
    command: ["--port", "27500", "--bots", "12", "--max-bots", "8", "--rotation", "slag-cathedral,relay", "--name", "josh-docker", "--stats", "/data/ferrite-stats.txt"]

volumes:
  ferrite-data:
