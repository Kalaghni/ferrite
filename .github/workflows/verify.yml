name: Rust verification
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux dependencies for Macroquad
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxi-dev libx11-dev libgl1-mesa-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked --all-targets
      - name: Clippy strict
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build dedicated server
        run: cargo build --locked --bin ferrite-server
      - name: Black-box UDP integration
        run: python scripts/smoke.py --spawn
