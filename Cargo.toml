[workspace]
members = ["crates/shared", "crates/server", "crates/client", "crates/forge-mcp"]
resolver = "2"

[workspace.package]
version = "0.15.4"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }

# quad-snd with output device selection added (vendor/quad-snd).
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
miniquad = { path = "vendor/miniquad" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# Shared by every crate (`[lints] workspace = true`). CI runs clippy with
# warnings denied.
[workspace.lints.clippy]
# Indexing the two teams or five points by number reads better than zips.
needless_range_loop = "allow"
# S2C variants are built, encoded and dropped; boxing would only add noise.
large_enum_variant = "allow"
