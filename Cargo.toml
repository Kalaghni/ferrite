[workspace]
members = ["crates/shared", "crates/server", "crates/client"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# quad-snd with output device selection added (vendor/quad-snd).
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
