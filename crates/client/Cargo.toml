[package]
name = "ferrite"
version.workspace = true
license.workspace = true
publish = false
edition.workspace = true

[dependencies]
ferrite-shared = { path = "../shared" }
ferrite-server = { path = "../server" }
macroquad = { version = "0.4", features = ["audio"] }
quad-snd = "0.2"
gilrs = "0.11.2"
# Updater: checking downloads against the release's SHA256SUMS, and
# reading the asset list GitHub's release API reports.
sha2 = "0.10"
serde = { workspace = true }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
